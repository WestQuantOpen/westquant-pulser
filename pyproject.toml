[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "westquant-pulser"
version = "0.1.0a1"
description = "Neutral-atom layout and control representation search for Pulser"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "westquant-core>=0.2.0a1",
  "pulser>=1.8,<2",
]

[project.scripts]
westquant-pulser-search = "westquant_pulser.cli:main"

[project.urls]
Homepage = "https://github.com/WestQuantOpen"
Source = "https://github.com/WestQuantOpen/westquant-pulser"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src","../westquant-core/src"]
